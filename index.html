<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="이준호의 Unity 클라이언트 개발 포트폴리오. Soul Collector, Cleanup Day, Barrel good Barrel, Hungry Foxy 2와 게임플레이·전투·상호작용 구현 경험을 소개합니다.">
  <title>이준호 — Unity Client Developer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <nav class="nav-wrap container" aria-label="Main navigation">
      <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><span data-name>이준호</span><span aria-hidden="true" style="color:var(--primary)">.</span></a>
      <div class="nav-links" id="navigation"></div>
      <div class="header-actions">
        <select class="language-select" id="language" aria-label="언어 / Language"><option value="ko">KO</option><option value="en">EN</option></select>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="navigation" aria-label="메뉴 열기">☰</button>
      </div>
    </nav>
  </header>
  <main id="main">
    <section class="hero" id="home" aria-labelledby="hero-title">
      <div class="hero-glow" aria-hidden="true"><span class="hero-orb hero-orb-indigo"></span><span class="hero-orb hero-orb-violet"></span><span class="hero-orb hero-orb-cyan"></span></div>
      <div class="hero-content container">
        <div class="hero-intro">
          <span class="eyebrow"><span class="status-dot" aria-hidden="true"></span><span id="hero-badge"></span></span>
          <h1 class="hero-title" id="hero-title"></h1>
          <p class="hero-name" id="hero-name"></p>
          <p class="hero-description" id="hero-description"></p>
          <ul class="hero-highlights" id="hero-highlights"></ul>
        </div>
        <div class="hero-actions" id="hero-actions"></div>
        <button class="hero-spotlight" id="hero-spotlight" type="button" aria-haspopup="dialog"></button>
      </div>
      <a class="scroll-hint" href="#profile" aria-label="프로필로 이동">SCROLL TO EXPLORE <span aria-hidden="true">↓</span></a>
    </section>
    <section class="section section-alt" id="profile" aria-labelledby="profile-title"><div class="container"><div class="section-heading" id="profile-heading"></div><p class="template-notice" id="template-notice"></p><div class="profile-grid" id="profile-content"></div></div></section>
    <section class="section" id="games" aria-labelledby="games-title"><div class="container"><div class="section-heading" id="games-heading"></div><h3 class="panel-title" id="featured-title"></h3><div class="featured-grid" id="featured-projects"></div><div class="filters" id="filters" role="group" aria-label="프로젝트 유형 필터"></div><div id="game-projects" aria-live="polite"></div></div></section>
    <section class="section section-alt" id="work" aria-labelledby="work-title"><div class="container"><div class="section-heading" id="work-heading"></div><div class="wip-grid" id="work-projects"></div></div></section>
    <section class="section" id="tools" aria-labelledby="tools-title"><div class="container"><div class="section-heading" id="tools-heading"></div><div class="tool-grid" id="tool-projects"></div></div></section>
    <section class="section" id="awards" aria-labelledby="awards-title"><div class="container"><div class="section-heading" id="awards-heading"></div><div class="award-grid" id="award-list"></div></div></section>
    <section class="section section-alt" id="skills" aria-labelledby="skills-title"><div class="container"><div class="section-heading" id="skills-heading"></div><div class="skills-grid" id="skill-list"></div></div></section>
    <section class="section" id="contact" aria-labelledby="contact-title"><div class="container"><div class="section-heading" id="contact-heading"></div><div class="contact-grid" id="contact-content"></div></div></section>
  </main>
  <footer class="site-footer"><div class="container footer-inner" id="footer-content"></div></footer>
  <dialog class="dialog" id="project-dialog" aria-labelledby="dialog-title"><div class="dialog-inner"><button type="button" class="dialog-close" id="dialog-close" aria-label="닫기">×</button><div id="dialog-body"></div></div></dialog>
  <noscript><p style="padding:2rem;color:white;background:#12121a">이 포트폴리오의 내용을 보려면 JavaScript를 활성화해주세요. Enable JavaScript to view this portfolio.</p></noscript>
</body>
</html>
